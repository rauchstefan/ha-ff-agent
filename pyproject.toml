[tool.ruff]
target-version = "py314"
line-length = 88
# Planning documents contain illustrative Python snippets, not runnable code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ASYNC",  # flake8-async
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# pytest-cov comes with pytest-homeassistant-custom-component.
addopts = "--cov=custom_components.ff_agent --cov-report=term-missing --cov-fail-under=95"
